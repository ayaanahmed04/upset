<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSET · Fighter research</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/web/research_champions.css">
<link rel="stylesheet" href="/web/research_rating.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0f0d0d;--surface:#181414;--surface-2:#201b1b;--surface-3:#2a2323;--line:#342c2c;--line-soft:#241e1e;
  --text:#f4f5f7;--text-2:#bdb5b3;--muted:#8a807d;
  /* Brand accent: blood red. --accent for fills and large text, --accent-text for small text (meets contrast). */
  --accent:#c1121f;--accent-track:#3a1418;--accent-text:#f0565f;--accent-ink:#ffffff;--accent-soft:rgba(193,18,31,.2);--accent-line:rgba(240,86,95,.5);
  --red:#e63946;--blue:#3a86ff;
  --win:#2a9d6f;--loss:#c1121f;--draw:#6b7280;
  --ko:#d95926;--sub:#199e70;--dec:#c98500;--oth:#5b616c;
  --pos-1:#f7b0b3;--pos-2:#e0525b;--pos-3:#a8141f;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --brand:'Russo One','Arial Black','Segoe UI Black',system-ui,sans-serif;
  --grunge:url('/assets/grunge.jpg');
  --body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:0px;
  --rail:132px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-left:var(--rail);background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1200px 500px at 15% -10%,rgba(230,57,70,.10),transparent 60%),radial-gradient(1000px 500px at 95% -15%,rgba(58,134,255,.10),transparent 60%);z-index:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 20px}
.display{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.brand{font-family:var(--brand);font-weight:400;text-transform:uppercase;letter-spacing:.01em}
.distressed{background:var(--grunge) 0 0/300px 300px,#ebe8e2;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@media (forced-colors:active){.distressed{background:none;color:CanvasText;-webkit-text-fill-color:CanvasText}}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(15,13,13,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.topbar{display:grid;grid-template-columns:minmax(0,420px);justify-content:center;align-items:center;gap:20px;min-height:76px;padding-top:10px;padding-bottom:10px;z-index:2}
.topbar:has(.search-slot:empty){display:none}
.rail{position:fixed;z-index:30;left:0;top:0;bottom:0;width:var(--rail);background:#08090b;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;padding:18px 0}
.rail a{display:block;line-height:0;border-radius:0}
.rail img{width:49px;height:auto;display:block}
.mlogo{display:none}
.rail a:hover img{filter:brightness(1.12)}
.method-link:hover{color:var(--text)}
.event-context{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin:14px 0}
.event-context p,.feature .event-details{margin:6px 0 0;color:var(--text-2);font-size:13px}
.event-context a,.event-details a{color:var(--text);text-underline-offset:3px}
.search-slot{min-width:0;width:100%}
.search-slot:empty{display:none}
.search-wrap{position:relative;z-index:2;width:100%;min-width:0;transition:filter .2s}
.search-shell{--cut:13px;position:relative;padding:1.5px;background:var(--line);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));transition:background .2s}
.search-wrap:hover .search-shell{background:var(--muted)}
.search-wrap input{--cut:12px;display:block;width:100%;height:48px;border-radius:0;border:0;outline:none;background:var(--surface);padding:0 56px 0 48px;font-size:15px;font-weight:500;clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.search-wrap input::placeholder{color:var(--text-2);opacity:.75}
.search-wrap input::-webkit-search-cancel-button{display:none}
.search-wrap svg{position:absolute;z-index:1;pointer-events:none;left:18px;top:16px;width:19px;height:19px;color:var(--muted);transition:color .2s,transform .2s}
.search-wrap .kbd{position:absolute;right:14px;top:11px;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font:12px var(--body);pointer-events:none}
.search-wrap.has-query .kbd,.search-wrap:focus-within .kbd{visibility:hidden}
.search-wrap:focus-within{filter:drop-shadow(0 0 12px rgba(193,18,31,.35))}
.search-wrap:focus-within .search-shell{background:var(--accent)}
.search-wrap:focus-within svg{color:var(--accent-text);transform:scale(1.08)}
.dropdown{position:absolute;z-index:5;top:calc(100% + 8px);left:0;right:0;background:var(--surface-2);border:1px solid var(--line);border-radius:0;box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:420px;overflow:auto;display:none;padding:6px}
.dropdown.open{display:block}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:8px 10px}
.opt:hover,.opt.hl{background:var(--surface-3)}
.opt .mini{width:34px;height:34px;flex:none;font-size:14px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.opt.dim b{color:var(--text-2);font-weight:500}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;margin:18px 0 12px}
#filters[hidden]{display:none}
#today{padding:6px 10px}
.filters-label{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:0;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.date{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.date input{background:var(--surface);border:1px solid var(--line);border-radius:0;height:36px;padding:0 12px;font-size:13px;color-scheme:dark}

/* matchup tray */
.tray{display:none;border-top:1px solid var(--line-soft)}
.tray.show{display:block}
.tray .wrap{display:flex;align-items:center;gap:12px;height:52px}
.slot{display:flex;align-items:center;gap:8px;min-height:36px;padding:5px 6px 5px 12px;border-radius:0;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;max-width:260px}
.slot i{width:8px;height:8px;border-radius:50%;flex:none}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.is-empty{color:var(--muted);font-weight:500;border-style:dashed;padding-right:12px}
.slot button{border:0;background:var(--surface-3);width:24px;height:24px;border-radius:0;color:var(--text-2);line-height:1}
.vs{font:800 18px/1 var(--display);color:var(--muted)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);border-radius:0;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#go[hidden]{display:none}
#choose-opponent[hidden]{display:none}
#choose-opponent{font-size:13px;white-space:nowrap}
@media(max-width:480px){.tray .wrap:has(#choose-opponent:not([hidden])){flex-wrap:wrap}}

main.wrap{z-index:2}
main{padding:28px 0 60px;transition:opacity .15s}
main.loading{opacity:.45}
#error{color:var(--accent-text);min-height:0}
#error:not(:empty){margin:0 0 16px;padding:12px 16px;border:1px solid rgba(193,18,31,.4);border-radius:0;background:rgba(193,18,31,.08)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.section-title h3{margin:0;font:400 19px/1.15 var(--brand);text-transform:uppercase;letter-spacing:.02em}
.section-title small{color:var(--muted);font-size:12px;text-align:right}
.spacer{height:18px}
.power-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.power-stat{min-width:0;border-left:2px solid var(--line);padding-left:12px}
.power-stat .lbl{font-size:13px;color:var(--text-2)}
.power-stat .num{font:400 34px/1.2 var(--brand);margin:8px 0}
.power-unit{font-size:12px;color:var(--text-2);margin-bottom:6px}
.metric-note{font-size:12px;line-height:1.6;color:var(--text-2);margin:16px 0 0}
.experimental-striking details{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.experimental-striking summary{cursor:pointer;font-size:14px;color:var(--text-2)}
.experimental-striking details .power-stat{margin-top:18px}
.comparison-name{font:400 17px/1.3 var(--brand);margin:0 0 10px;overflow-wrap:anywhere}
.common-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,minmax(0,1.5fr));gap:20px;padding:18px 0;border-top:1px solid var(--line-soft)}
.common-list{margin-top:16px}
.common-side,.common-opponent{min-width:0;overflow-wrap:anywhere}
.common-opponent .opp{text-align:left}
.common-name{display:block;font-size:13px;margin-bottom:10px}
.common-name.red{color:var(--accent-text)}
.common-name.blue{color:var(--blue)}
.common-meeting{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:10px 0}
.common-meeting .chip{flex-shrink:0}
.common-meeting .sub{display:block;color:var(--text-2);font-size:12px;line-height:1.5;margin-top:3px}
@media(max-width:700px){
  .power-grid{grid-template-columns:1fr;gap:16px}
  .power-stat .num{font-size:30px;margin:4px 0}
  .common-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .common-opponent{grid-column:1 / -1}
}

/* ---------- Home ---------- */
.home-hero{padding:40px 0 10px}
.home-hero h1{font:400 clamp(40px,6vw,82px)/.98 var(--brand);text-transform:uppercase;margin:14px 0 18px;letter-spacing:0}
.home-hero h1 em{font-style:normal;color:var(--accent);-webkit-text-fill-color:var(--accent);background:none}
.home-hero p{max-width:620px;color:var(--text-2);font-size:17px;margin:0}
.home-hero .home-tagline{font-family:var(--body);font-weight:500;line-height:1.6;color:var(--text-2)}
.counters{display:flex;gap:44px;flex-wrap:wrap;margin:36px 0}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:48px;align-items:center}
.hero-row .counters{margin-bottom:0}
/* Balance the label/helper around the field so it lines up with the counter numbers. */
.hero-search{position:relative;z-index:3;min-width:0;align-self:end;top:28px}
.hero-search .eyebrow{display:block;margin-bottom:12px}
.hero-search>small{display:block;margin-top:12px;color:var(--muted);font-size:13px}
.search-wrap.big .search-shell{--cut:18px}
.search-wrap.big input{--cut:17px;height:68px;font-size:19px;padding:0 64px 0 60px}
.search-wrap.big svg{left:22px;top:24px;width:23px;height:23px}
.search-wrap.big .kbd{top:24px;right:20px;font-size:13px}
.search-wrap.big:focus-within{filter:drop-shadow(0 0 22px rgba(193,18,31,.5))}
@media(prefers-reduced-motion:reduce){.search-wrap,.search-shell{transition:none}}
.counter strong{display:block;font:400 40px/1 var(--brand)}
.counter span{color:var(--muted);font-size:13px}
.feature{margin-top:30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:linear-gradient(100deg,rgba(230,57,70,.18),rgba(21,23,28,1) 40%,rgba(21,23,28,1) 60%,rgba(58,134,255,.18))}
.feature .names{font:400 clamp(22px,3vw,34px)/1.1 var(--brand);text-transform:uppercase}
.feature .names b{color:var(--muted);font-weight:700;margin:0 12px}

/* ---------- Avatars ---------- */
.avatar{position:relative;border-radius:0;overflow:hidden;display:grid;place-items:center;background:var(--surface-3);font:800 18px/1 var(--display);color:var(--text);letter-spacing:.04em;flex:none}
.avatar.mono{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px),linear-gradient(160deg,#2b303b,#171a20)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.portrait{width:200px;height:240px;border-radius:0;font-size:84px;color:rgba(255,255,255,.9)}
.portrait.red{box-shadow:inset 0 -6px 0 var(--red)}
.portrait.blue{box-shadow:inset 0 -6px 0 var(--blue)}

/* ---------- Fighter hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding:26px;background:linear-gradient(120deg,#1b1e25 0%,#14161b 55%);position:relative;isolation:isolate;overflow:hidden}
.division-watermark{position:absolute;left:26px;right:26px;bottom:16px;z-index:0;font:400 clamp(28px,8vw,100px)/1.15 var(--brand);text-transform:uppercase;text-align:right;color:rgba(255,255,255,.025);white-space:nowrap;pointer-events:none;user-select:none}
.hero>:not(.division-watermark){position:relative;z-index:1}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:0;background:var(--surface-3);color:var(--text-2)}
.badge.active{background:rgba(42,157,111,.16);color:#7fe0b4}
.badge.active::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.2)}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}
.fname{font:400 clamp(36px,5vw,66px)/.98 var(--brand);text-transform:uppercase;margin:14px 0 16px;letter-spacing:0}
.record{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.record .big{font:400 46px/.95 var(--brand)}
.record .big small{font:600 13px/1 var(--body);color:var(--muted);display:block;margin-top:8px;letter-spacing:.06em;text-transform:uppercase}
.tape{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.tape div{padding:0 22px 0 0;margin:0 22px 8px 0;border-right:1px solid var(--line)}
.tape div:last-child{border:0}
.tape b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.02em}
.tape span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tape em{font-style:normal;color:var(--text-2);font-size:13px;font-family:var(--body);font-weight:500;margin-left:4px;text-transform:none}
.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.form{display:flex;gap:4px;align-items:center}
.chip{width:24px;height:24px;border-radius:0;display:grid;place-items:center;font:700 12px/1 var(--body);color:#fff}
.chip.win{background:var(--win)}.chip.loss{background:var(--loss)}.chip.other{background:var(--draw)}
.window-note{margin:22px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--text-2);font-size:14px}
.window-note b{color:var(--text)}

/* ---------- Skill meters ---------- */
.meters{display:grid;gap:14px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.meter .lbl{font-size:14px;color:var(--text-2)}
.meter .val{font:700 20px/1 var(--display);text-align:right;letter-spacing:.02em}
.meter .val small{font:600 11px/1 var(--body);color:var(--muted);margin-left:6px;letter-spacing:.04em}
.track{grid-column:1/-1;position:relative;height:8px;border-radius:0;background:var(--accent-track)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0;background:var(--accent)}
.track .med{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-2);border-radius:0;opacity:.7}
.track.none{background:var(--surface-3)}
.pct{font:700 12px/1 var(--body);color:var(--text);letter-spacing:.02em}
.pct.elite{color:var(--accent-text)}
.meta-line{font-size:12px;color:var(--muted);margin-top:14px}

/* ---------- Stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px}
.tile .lbl{font-size:13px;color:var(--text-2)}
.tile .num{font:400 38px/1 var(--brand);margin:10px 0 8px}
.tile .num small{font-size:20px;color:var(--muted);margin-left:2px}
.tile .rank{font-size:12px;color:var(--muted)}
.tile .rank b{color:var(--accent-text)}

/* ---------- Strike map ---------- */
.strikemap{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.strikemap svg{width:100%;height:auto}
.targets{display:grid;gap:12px}
.target{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px}
.target .k{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.target .v{font:700 24px/1 var(--display);min-width:56px;text-align:right}
.target .bar{height:8px;border-radius:0;background:var(--surface-3);position:relative}
.target .bar i{position:absolute;inset:0 auto 0 0;border-radius:0;background:var(--strike-color,var(--accent))}
.target small{grid-column:2/-1;color:var(--muted);font-size:12px;margin-top:-6px}
.stack{display:flex;height:14px;gap:2px;border-radius:0;overflow:hidden;margin:10px 0 10px}
.stack i{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:0;display:inline-block}
.legend b{color:var(--text);font-weight:600}
.method-row{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:12px;margin:12px 0}
.method-row .k{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.method-row .n{font:700 20px/1 var(--display);text-align:right}
.method-row .stack{margin:0;height:22px}
.method-row .stack i{display:grid;place-items:center;font:700 12px/1 var(--body);color:#fff;overflow:visible}
.finish{font:400 36px/1 var(--brand)}

/* ---------- Timeline chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.mark,.chart .hit:focus+.mark{filter:brightness(1.25)}
.tip{position:fixed;z-index:50;pointer-events:none;background:#0b0c0f;border:1px solid var(--line);border-radius:0;padding:10px 12px;font-size:12px;color:var(--text-2);box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:260px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip strong{display:block;color:var(--text);font-size:18px;font-family:var(--display);letter-spacing:.02em}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r b{color:var(--text);font-weight:600}

/* ---------- History ---------- */
.history{display:grid;gap:2px}
.hrow{display:grid;grid-template-columns:96px 34px minmax(0,1.4fr) minmax(0,1.2fr) 130px;gap:14px;align-items:center;padding:12px 10px;border-radius:0}
.hrow:nth-child(odd){background:rgba(255,255,255,.018)}
.hrow.head{background:none;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding-top:0}
.hrow .date{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.opp{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px;color:var(--text)}

    <a class="about-back" href="#/">← Back to UPSET</a>
    <header class="about-heading"><h1>Methodology</h1></header>
    <h2>Recorded UFC stats</h2>
    <p>The date filter includes fights strictly before the selected date. The stats window uses all available UFC fights or the last 3, 5 or 10. Rates divide total counts by total recorded fight time. Per-15-minute rates put different fight lengths on the same time scale.</p>
    <p>Control time comparisons use fights with control time recorded for both fighters. Recorded stats describe what happened in those fights. Opponent quality can differ between fighters’ samples.</p>
    <h2>Experimental UPSET rating</h2>
    <p>The 60–99 grade combines results and recorded skills from the fighter’s full UFC history before the cutoff. Open any rating badge to see what moved the grade, its limits and the formula. Win probabilities require a separately validated model.</p>
    <h2>Archive coverage</h2>
    <p>UFC records include reviewed historical results. Stats windows and ratings use fights with paired statistics. Recent fights with unresolved identities or conflicting source results await review. Historical views use currently reviewed outcomes, including amendments. Weight, height and reach come from the saved profile, which can predate a fighter’s move to another division.</p>
    <p>Professional MMA records are dated snapshots for selected fighters. They include fights outside the UFC and appear when the selected date reaches the source review date.</p>
  </article>
</template>

            title: 'Ayaan Ahmed on LinkedIn', 'aria-label': 'Ayaan Ahmed on LinkedIn (opens in a new tab)'}, 'Ayaan Ahmed'))),
      h('p', {class: 'about-intro', text:

      h('p', null, 'I created ', h('strong', {text: 'UPSET'}),

function chartLimit(){return innerWidth<700?10:20;}

function timelineRange(...histories){
  const values=histories.flatMap(history=>history.slice(0,chartLimit()))
    .filter(fight=>!shortFight(fight)).map(fight=>fight.sig_differential_per_minute||0);
  return [Math.max(0,...values),-Math.min(0,...values)];

function timeline(history,range=timelineRange(history)){
  const compact=innerWidth<700;
  const values=history.slice(0,chartLimit()).reverse();
  if(!values.length)return h('p',{class:'muted',text:'No recorded fights before this date.'});
  const niceUp=x=>{if(x<=0)return 0;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;};
  let [posT,negT]=range.map(niceUp);
  const W=compact?380:760,top=14,plotH=compact?120:150,left=compact?34:40,right=12,plotW=W-left-right;
  // Keep both endpoint labels at least 20 SVG units from zero on mixed-sign charts.
  // Padding the smaller side preserves one linear scale for every bar.
  if(posT&&negT){const minSide=niceUp(Math.max(posT,negT)*20/(plotH-20));posT=Math.max(posT,minSide);negT=Math.max(negT,minSide);}
  const scale=plotH/(posT+negT||1),base=top+posT*scale,bottom=base+negT*scale+38,H=bottom+28;
  const step=plotW/values.length,bw=Math.min(24,step*.62);
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Significant strike differential per minute in each of the last '+values.length+' fights, oldest to newest'});
  for(const t of new Set([posT,0,-negT])){if(t===0&&(posT===0&&negT===0))continue;const y=base-t*scale;svg.append(s('line',{x1:left,x2:W-right,y1:y,y2:y,stroke:t===0?'#4a505c':'#22262e','stroke-width':1}));svg.append(s('text',{x:left-8,y:y+4,'text-anchor':'end','font-size':11,fill:'var(--muted)','font-family':'Inter,system-ui'},t>0?'+'+t:t));}
  // A year label belongs to its whole run of fights, including one-bout years.
  const years=new Map();
  values.forEach((fight,i)=>{
    const year=fight.date.slice(0,4),group=years.get(year)||[];
    group.push(i);
    years.set(year,group);
  });
  for(const [year,group] of years){
    const first=group[0],last=group.at(-1),cx=left+step*(first+last+1)/2;
    svg.append(s('text',{x:cx,y:bottom+22,'text-anchor':'middle','font-size':11,fill:'var(--muted)','font-family':'Inter,system-ui'},year));
  }
  values.forEach((r,i)=>{
    const v=r.sig_differential_per_minute,cx=left+step*i+step/2,x=cx-bw/2;

    const g=s('g',{tabindex:0,role:'img','aria-label':`${niceDate(r.date)}, ${r.opponent}, ${resultLabel(r)}, differential ${signed(v)} per minute${short?', under one minute, rate omitted from plot':''}`});

    g.append(hit);
    if(short)g.append(s('circle',{class:'mark',cx,cy:base,r:4,fill:'var(--muted)'}));
    else if(v!=null){const hgt=Math.max(1.5,Math.abs(v)*scale),rad=Math.min(4,hgt);
      const d=v>=0?`M${x},${base} V${base-hgt+rad} Q${x},${base-hgt} ${x+rad},${base-hgt} H${x+bw-rad} Q${x+bw},${base-hgt} ${x+bw},${base-hgt+rad} V${base} Z`
                  :`M${x},${base} V${base+hgt-rad} Q${x},${base+hgt} ${x+rad},${base+hgt} H${x+bw-rad} Q${x+bw},${base+hgt} ${x+bw},${base+hgt-rad} V${base} Z`;
      g.append(s('path',{class:'mark',d,fill:v>=0?'#2a9d6f':'#c1121f'}));}
    const col=r.outcome==='win'?'#2a9d6f':r.outcome==='loss'?'#c1121f':'#6b7280';
    g.append(s('rect',{x:cx-10,y:bottom-18,width:20,height:20,rx:4,fill:col}));
    g.append(s('text',{x:cx,y:bottom-4,'text-anchor':'middle','font-size':10,'font-weight':700,fill:'#fff','font-family':'Inter,system-ui'},resultChip(r)));
    bindTip(g,()=>[h('strong',{text:signed(v)+' / min'}),h('div',{text:'vs '+r.opponent}),
      h('div',{class:'r'},h('span',{text:niceDate(r.date)}),h('b',{text:resultLabel(r)})),
      h('div',{class:'r'},h('span',{text:'Method'}),h('b',{text:displayMethod(r)})),
      h('div',{class:'r'},h('span',{text:'Sig. landed / absorbed'}),h('b',{text:r.own.sig_strikes_landed+' / '+r.opponent_stats.sig_strikes_landed})),
      ...(short?[h('div',{text:'Under one minute · rate omitted from plot'})]:[])]);
    svg.append(g);

    values.some(shortFight)?h('p',{class:'meta-line',text:'Dots mark fights under one minute. Select a dot to see its rate.'}):null);
}

function roundedShares(counts,total){
  const exact=Object.entries(counts).map(([key,count])=>[key,100*count/total]);
  const rounded=Object.fromEntries(exact.map(([key,value])=>[key,Math.floor(value)]));
  const remainder=100-Object.values(rounded).reduce((sum,value)=>sum+value,0);
  exact.sort(([a,x],[b,y])=>(y-rounded[b])-(x-rounded[a]));
  for(const [key] of exact.slice(0,remainder))rounded[key]++;
  return rounded;
}

function matchupNameLines(name){
  const words=name.trim().split(/\s+/);
  if(words.length<2)return words;
  // Balance visual word groups without assuming where a surname starts.
  let split=1,best=Infinity;
  for(let i=1;i<words.length;i++){const diff=Math.abs(words.slice(0,i).join(' ').length-words.slice(i).join(' ').length);if(diff<best){best=diff;split=i;}}
  return [words.slice(0,split).join(' '),words.slice(split).join(' ')];
}
function fitMatchupNames(){
  const headings=[...document.querySelectorAll('.faceoff .fname')];
  if(!headings.length)return;
  // Measure at the CSS size, then give both fighters the same fitted size.
  // Repeating this after a resize must also let the type grow back to normal.
  headings.forEach(node=>node.style.removeProperty('font-size'));
  const base=Math.min(...headings.map(node=>parseFloat(getComputedStyle(node).fontSize)));
  const ratio=Math.min(1,...headings.map(node=>{
    const width=node.clientWidth,needed=Math.max(...[...node.querySelectorAll('.name-line')].map(line=>line.scrollWidth));
    return width>0&&needed>width?Math.max(0,width-2)/needed:1;
  }));
  const size=Math.floor(base*ratio*100)/100;
  headings.forEach(node=>node.style.fontSize=size+'px');
}

function validCutoff(value,today){

    && new Date(value+'T00:00:00Z').toJSON()?.slice(0,10)===value;

function syncFilters(query){
  const today=localToday(),before=query.get('before'),window=query.get('window');

async function runSearch(q,sv){
  const ctl=new AbortController();searchAbort=ctl;
  const slow=setTimeout(()=>{if(sv===searchVersion)searchStatus('Searching…');},450);
  const limit=setTimeout(()=>ctl.abort(),8000);
  const filter='?q='+encodeURIComponent(q)+'&before='+encodeURIComponent(state.before);

    record:icon('<rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4h6v3H9z"/><path d="m9 13.5 2 2 4-4.5"/>'),
    events:icon('<path d="M8.5 3h7l5.5 5.5v7L15.5 21h-7L3 15.5v-7z"/><path d="M8 12h8M12 8v8"/>'),
    'time-machine':icon('<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/>'),
    upsets:icon('<path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/>'),
    methodology:icon('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/><path d="M8.5 7.5h7M8.5 11h5"/>')
  };
  const links=[...document.querySelectorAll('.rail .rail-links a')];
  for(const link of links){
    const label=link.textContent.trim();
    link.innerHTML=(ICONS[link.dataset.section]||'')+'<span></span>';
    link.lastChild.textContent=label;
  }
  // The phone strip reuses the rail's links, so routing marks the current page in both places.
  const strip=document.createElement('nav');
  strip.className='mnav rail-links';
  strip.setAttribute('aria-label','Sections');
  links.forEach(link=>strip.append(link.cloneNode(true)));
  document.querySelector('header.top .topbar')?.after(strip);

  // Fight-week chip: shows the next scheduled card during its final two weeks.
  const chip=document.createElement('a');
  chip.className='rail-fightweek';
  chip.hidden=true;
  chip.innerHTML='<span class="rf-label">Fight week</span><strong></strong><span class="rf-count"></span><span class="rf-date"></span>';
  document.querySelector('.rail')?.append(chip);
  Promise.all([fetch('/api/meta').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]).then(([meta,events])=>{
    const next=events.scheduled;
    if(!next?.starts_at)return;
    const start=new Date(next.starts_at);
    const tick=()=>{
      const minutes=Math.ceil((start-Date.now())/60000);
      if(minutes<=0||minutes>14*1440){chip.hidden=true;return;}
      const days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60);

      setTimeout(tick,60000);
    };
    chip.href=(meta.share_routes?'':'#')+'/event/'+encodeURIComponent(next.slug);
    chip.setAttribute('aria-label',next.name+' starts '+start.toLocaleString());
    chip.querySelector('strong').textContent=next.name;
    chip.querySelector('.rf-date').textContent=start.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    tick();
  }).catch(()=>{});
})();

<script id="refresh-home-js">
function hpGrade(score){return gradeChip(score);}
function hpWhen(iso){
  const day=new Date(iso+'T12:00:00'),today=new Date(localToday()+'T12:00:00');
  const days=Math.round((day-today)/864e5);
  const weekday=day.toLocaleDateString('en-US',{weekday:'long'});
  if(days===0)return 'Tonight';
  if(days===1)return 'Tomorrow';
  if(days>1&&days<7)return 'This '+weekday;
  return day.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function hpCompareUrl(a,b){return viewerUrl('/compare/'+encodeURIComponent(a)+'/'+encodeURIComponent(b));}
function hpMethod(bout){
  if(bout.outcome==='draw')return 'Draw';
  if(bout.outcome==='nc')return 'No contest';
  const m=(bout.method||'').replace('Decision - Unanimous','Unanimous dec.').replace('Decision - Split','Split dec.').replace('Decision - Majority','Majority dec.');
  return m+(bout.round&&!/dec\./i.test(m)?' · R'+bout.round+(bout.time?' '+bout.time:''):'');
}
/* UPSET Rating v5 serves a forecast with each scheduled bout; older ratings do not, and nothing is shown. */
function hpForecast(bout,mini){
  const f=bout.forecast;
  if(!f||f.status!=='available'||typeof v5ForecastBar!=='function')return null;
  const bar=v5ForecastBar(f,true);
  const flag=typeof v5MarketFlag==='function'?v5MarketFlag(f,bout.fighters):null;
  const body=flag?h('div',null,bar,flag):bar;
  return mini?body:h('div',{class:'hp-fc',title:'UPSET forecast from fights before this card. Not betting advice.'},h('span',{text:'UPSET forecast'}),body);
}
function hpCorner(r,side){
  const titles=r.championships?.titles||[];
  return h('div',{class:'corner '+side},
    championPortrait(r,'portrait '+side,UPSETRating.badge(r,{matchup:true})),
    h('div',{class:'corner-info'},
      h('div',{class:'corner-label',text:side==='red'?'Red corner':'Blue corner'}),
      h('h2',{class:'fname'},h('a',{class:'opp',href:viewerUrl('/fighter/'+encodeURIComponent(r.id)),style:'color:inherit;text-decoration:none'},
        matchupNameLines(r.name).map((line,i)=>h('span',{class:'name-line distressed',text:(i?' ':'')+line})))),
      h('div',{class:'rec',text:careerRecord(r)+'  ·  '+streakText(r.summary.streak)}),
      h('div',{style:'height:10px'}),
      h('div',{class:'badges'},
        titles.map(t=>h('span',{class:'badge champion-status',text:t.division+' '+t.label})),
        r.professional_record?h('span',{class:'badge',text:'Pro '+proRecordText(r.professional_record)}):null)));
}
async function hpFightWeek(slot,signal){
  const events=await api('/api/events',signal),next=events.scheduled;
  if(!next||signal.aborted){slot.remove();return events;}
  const card=await api('/api/event?slug='+encodeURIComponent(next.slug),signal);
  const main=card.bouts[0],rest=card.bouts.slice(1).filter(b=>b.group===main.group);
  const pairs=await Promise.all([main,...rest].map(b=>b.fighters.every(f=>f.id)?
    api('/api/compare?a='+encodeURIComponent(b.fighters[0].id)+'&b='+encodeURIComponent(b.fighters[1].id)+params(),signal).catch(()=>null):null));
  if(signal.aborted||state.view!=='home')return events;
  const [lead]=pairs;
  const where=next.venue?next.venue.split(',')[0]:'';
  const label=[hpWhen(next.date),where].filter(Boolean).join(' · ');
  const bouts=rest.map((bout,i)=>{
    const res=pairs[i+1],[A,B]=res?res.fighters:[null,null];
    const side=(f,r,cls)=>h('div',{class:'hp-side '+cls},hpGrade(r?.rating?.score),
      h('div',{style:'min-width:0'},h('strong',{text:f.name}),h('small',{text:r?careerRecord(r):''})));
    const inner=[side(bout.fighters[0],A,'red'),
      h('div',{class:'hp-mid'},h('span',{text:bout.division}),hpForecast(bout,true),h('b',{text:bout.rounds+' rounds'+(bout.title?' · Title':'')})),
      side(bout.fighters[1],B,'blue')];
    return res?h('a',{class:'hp-bout',href:hpCompareUrl(bout.fighters[0].id,bout.fighters[1].id),'aria-label':'Compare '+bout.fighters.map(f=>f.name).join(' and ')},inner)
      :h('div',{class:'hp-bout'},inner);
  });
  slot.replaceChildren(
    h('div',{class:'hp-head'},
      h('div',null,h('span',{class:'eyebrow',text:label}),
        h('h2',null,h('span',{class:'distressed',text:next.name}),next.headline?h('span',{style:'color:var(--muted)',text:' · '}):null,
          next.headline?h('span',{class:'distressed',text:next.headline}):null)),
      h('div',{class:'hp-head-links'},eventCountdown(next.starts_at),h('a',{href:eventUrl(next.slug),text:'Full card →'}))),
    lead?h('section',{class:'card faceoff hp-faceoff'},
      hpCorner(lead.fighters[0],'red'),
      h('div',{class:'hp-vs'},h('div',{class:'bigvs'},h('span',{class:'distressed',text:'VS'})),
        h('small',{text:[main.division,main.title?'title fight':null,main.rounds+' rounds'].filter(Boolean).join(' · ')}),
        hpForecast(main,false),
        h('a',{class:'btn primary',href:hpCompareUrl(main.fighters[0].id,main.fighters[1].id),text:'Tale of the tape →'})),
      hpCorner(lead.fighters[1],'blue')):null,
    bouts.length?h('div',{class:'hp-card'},h('div',{class:'hp-card-label'},h('span',{text:'Rest of the main card'}),h('span',{text:'Tap a fight to compare'})),bouts):null);
  fitMatchupNames();
  return events;
}
async function hpResults(slot,events,signal){
  const last=events?.archived?.[0];
  if(!last){slot.remove();return;}
  const card=await api('/api/event?slug='+encodeURIComponent(last.slug),signal);
  if(signal.aborted||state.view!=='home')return;
  const decided=card.bouts.filter(b=>b.status==='reviewed').slice(0,5);
  slot.replaceChildren(
    h('div',{class:'section-title'},h('h3',{text:'Latest results'}),h('a',{href:eventUrl(last.slug),style:'font-size:13px;color:var(--text)',text:'All '+card.bouts.length+' fights →'})),
    h('p',{class:'hp-sub',text:eventTitle(last)+' · '+niceDate(last.date)}),
    ...decided.map(bout=>{
      const won=bout.fighters.find(f=>f.id===bout.winner_id),lost=bout.fighters.find(f=>f.id!==bout.winner_id);
      const decisive=bout.outcome==='decisive'&&won;
      return h('a',{class:'hp-res',href:fightUrl(bout.id)},
        h('div',{class:'hp-res-who'},
          decisive?h('span',{class:'chip win',text:'W'}):h('span',{class:'chip other',text:bout.outcome==='nc'?'NC':'D'}),
          h('span',{class:'hp-win',text:(decisive?won:bout.fighters[0]).name}),
          h('span',{class:'hp-def',text:decisive?'def.':'vs'}),
          h('span',{class:'hp-lose',text:(decisive?lost:bout.fighters[1]).name})),
        h('div',{class:'hp-how'},hpMethod(bout),h('small',{text:bout.division||''})));
    }));
}
async function hpUpsetTeaser(slot,signal){
  if(!state.meta?.upset_tracker){slot.remove();return;}
  const data=await api('/api/upsets',signal);
  if(signal.aborted||state.view!=='home')return;
  const shock=data.market?.recent_shock;
  if(shock){
    const chip=g=>g!=null?hpGrade(g):h('span',{class:'ut-new',text:'NEW'});
    const last=shock.winner.name.split(' ').slice(-1)[0];
    slot.href=viewerUrl('/upsets');
    slot.replaceChildren(
      h('span',{class:'eyebrow',text:'Upset Tracker · '+niceDate(shock.date)}),
      h('h3',{text:'Biggest upset of the year'}),
      h('div',{class:'hp-upset-line'},chip(shock.winner.grade),h('b',{text:shock.winner.name}),h('span',{text:'beat'}),
        chip(shock.opponent.grade),h('b',{style:'color:var(--text-2)',text:shock.opponent.name})),
      h('p',{text:last+' went in as a '+shock.winner_line+' underdog ('+Math.round(100*shock.market_chance)+'% betting chance) and won by '+methodWords(shock.method)+'.'+
        (shock.upset_chance!=null?' UPSET gave '+last+' '+Math.round(100*shock.upset_chance)+'%.':'')}),
      h('span',{class:'hp-go',text:'See every upset →'}));
    return;
  }
  const recent=data.latest_upsets.filter(b=>b.date>=data.recent_since);
  const byChance=(a,b)=>a.winner_chance!=null&&b.winner_chance!=null?a.winner_chance-b.winner_chance:b.gap-a.gap;
  const pick=[...(recent.length?recent:data.latest_upsets)].sort((a,b)=>byChance(a,b)||b.date.localeCompare(a.date))[0];
  if(!pick){slot.remove();return;}
  slot.href=viewerUrl('/upsets');
  slot.replaceChildren(
    h('span',{class:'eyebrow',text:'Upset Tracker · '+niceDate(pick.date)}),
    h('h3',{text:'Biggest recent upset'}),
    h('div',{class:'hp-upset-line'},hpGrade(pick.winner.grade),h('b',{text:pick.winner.name}),h('span',{text:'beat'}),
      hpGrade(pick.opponent.grade),h('b',{style:'color:var(--text-2)',text:pick.opponent.name})),
    h('p',{text:pick.winner_chance!=null?'The UPSET forecast gave '+pick.winner.name.split(' ').slice(-1)[0]+' a '+Math.round(100*pick.winner_chance)+'% chance going in. Won by '+methodWords(pick.method)+'.'
      :'The underdog went in rated '+pick.gap+' points lower and won by '+methodWords(pick.method)+'.'}),
    h('span',{class:'hp-go',text:'See every upset →'}));
}
async function hpTimeTeaser(slot,signal){
  if(!state.meta?.share_routes){slot.remove();return;}

    h('span',{class:'hp-go',text:'Make your pick →'}));

async function renderHome(signal){
  const m=state.meta,c=$('content');
  const years=m?(+m.latest_bout.slice(0,4))-(+(m.first_reviewed_result||m.earliest_bout).slice(0,4)):null;
  placeSearch('header');

  const results=h('section',{class:'card hp-results'},h('div',{class:'hp-skeleton'}));
  const upset=h('a',{class:'card hp-teaser'},h('div',{class:'hp-skeleton'}));
  const time=h('a',{class:'card hp-teaser time'},h('div',{class:'hp-skeleton'}));
  c.replaceChildren(h('section',{class:'home-hero'},
    h('div',{class:'eyebrow',text:'UFC fighter research'}),
    h('h1',null,h('span',{class:'distressed'},'Every fighter.',h('br'),'Every fight. '),h('em',{text:'UPSET.'})),
    h('div',{class:'hero-row'},
      h('div',null,
        h('p',{class:'home-tagline',text:'Look up UFC fighters and compare their fight stats.'}),
        h('div',{class:'counters'},
          h('div',{class:'counter'},h('strong',{text:m?int(m.fighters_with_fights??m.fighters):'—'}),h('span',{text:m&&m.fighters_with_fights?'UFC fighters with fight stats':'fighter profiles'})),
          h('div',{class:'counter'},h('strong',{text:m?int(m.total_bouts):'—'}),h('span',{text:'UFC bouts with stats'})),
          h('div',{class:'counter'},h('strong',{text:years??'—'}),h('span',{text:'years of history'})))),
      h('div',{class:'hero-search'},

}

<script id="refresh-shared-js">
/* Two-line fighter names for face-offs. Every .fit-name inside one [data-name-group] gets the same font size,
   shrunk only as far as the longest line needs, so the two corners always line up. */
function nameLines(name){return matchupNameLines(name).map(line=>h('span',{class:'name-line',text:line}));}
function fitNameGroup(nodes){
  nodes=nodes.filter(node=>node.isConnected&&node.clientWidth>0);
  if(!nodes.length)return;
  nodes.forEach(node=>node.style.removeProperty('font-size'));
  const base=Math.min(...nodes.map(node=>parseFloat(getComputedStyle(node).fontSize)));
  const ratio=Math.min(1,...nodes.map(node=>{
    const width=node.clientWidth,needed=Math.max(0,...[...node.querySelectorAll('.name-line')].map(line=>line.scrollWidth));
    return needed>width?Math.max(0,width-2)/needed:1;
  }));
  const size=Math.floor(base*ratio*100)/100;
  nodes.forEach(node=>node.style.fontSize=size+'px');
}
function fitNameGroups(){document.querySelectorAll('[data-name-group]').forEach(group=>fitNameGroup([...group.querySelectorAll('.fit-name')]));}
(()=>{
  let frame=0;
  const schedule=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(fitNameGroups);};
  addEventListener('resize',schedule);
  const content=document.getElementById('content');
  if(content)new MutationObserver(schedule).observe(content,{childList:true,subtree:true});
  document.fonts?.ready.then(schedule);
})();
/* Same colour bands as the full rating badge: 90s red, 80s orange, 70s yellow, 60s blue. */
function gradeChip(score,size){
  const tier=score==null?'none':score>=90?'t90':score>=80?'t80':score>=70?'t70':'t60';
  return h('span',{class:'grade-chip '+tier+(size?' '+size:''),title:score==null?'No UPSET rating yet':'Experimental UPSET rating '+score},
    h('span',{text:score??'—'}));
}
function methodWords(method){
  const m=method||'';
  if(/KO|TKO/.test(m))return 'knockout';
  if(/Submission/i.test(m))return 'submission';
  if(/Split/.test(m))return 'split decision';
  if(/Majority/.test(m))return 'majority decision';
  if(/Decision/.test(m))return 'unanimous decision';
  return m.toLowerCase()||'decision';
}

<script id="refresh-time-machine-js">
(()=>{
  const randomDraw=window.drawTimeMachine;
  // A link with ?fight=<id> opens that bout; otherwise draw a random title fight or main event.
  window.drawTimeMachine=async function(signal){
    const id=readRoute().query.get('fight');
    if(id&&state.tmLinked!==id){
      state.tmLinked=id;
      try{
        const f=await api('/api/fight?id='+encodeURIComponent(id),signal);
        if(f.fighters.every(x=>x.id))return {id:f.id,date:f.date,fighters:f.fighters.map(x=>({id:x.id,name:x.name})),
          label:f.title?(f.division||'UFC').replace(/^UFC\s+/,'').replace(/\s*(Title\s+)?Bout$/i,'')+' title fight':(f.event?eventTitle(f.event):'UFC fight'),event_info:f.event_info||null};
      }catch(error){if(signal.aborted)throw error;}
    }
    return randomDraw(signal);
  };
})();
function tmScore(update){
  let score={right:0,total:0,streak:0};
  try{score=JSON.parse(sessionStorage.getItem('upset.tm.score'))||score;}catch{}
  if(update){
    score.total++;
    if(update==='right'){score.right++;score.streak++;}else score.streak=0;
    try{sessionStorage.setItem('upset.tm.score',JSON.stringify(score));}catch{}
  }
  return score;
}
function tmFacts(r){
  const m=r.metrics||{},fights=m.bouts||0;
  const wins=r.summary.career.win,finishes=m.results_by_method?(m.results_by_method.win.ko+m.results_by_method.win.sub):null;
  const row=(label,value)=>h('div',{class:'tm-fact'},h('span',{text:label}),h('b',{text:value}));
  return h('div',{class:'tm-facts'},
    row('Age',r.summary.age??'—'),
    row('Streak',streakText(r.summary.streak)),
    row('Strikes landed / min',fights?fmt(m.sig_landed_per_minute):'—'),
    row('Strikes absorbed / min',fights?fmt(m.sig_absorbed_per_minute):'—'),
    row('Takedowns / 15 min',fights?fmt(m.takedowns_per_15_minutes):'—'),
    row('Wins by finish',finishes!=null&&wins?finishes+' of '+wins:'—'));
}
function renderTimeMachine(fight,signal){
  const scoreBox=h('div',{class:'tm-score'});
  const paintScore=()=>{const s=tmScore();scoreBox.replaceChildren(
    h('div',null,h('strong',{text:s.right+' / '+s.total}),h('span',{text:'your picks this visit'})),
    h('div',null,h('strong',{text:s.streak}),h('span',{text:'in a row'})));};
  paintScore();
  const stage=h('div',{'aria-live':'polite'});
  const next=h('button',{class:'btn',type:'button',text:'Skip to another fight',onclick:()=>draw()});
  async function draw(){
    next.disabled=true;
    stage.replaceChildren(h('div',{class:'tm-card hp-skeleton',style:'min-height:320px'}));
    try{
      const bout=await drawTimeMachine(signal);
      if(signal.aborted)return;
      bout?await show(bout):stage.replaceChildren(h('p',{class:'card muted',text:'No other matchups are available in this release.'}));
    }catch{
      if(!signal.aborted)stage.replaceChildren(h('p',{class:'card muted',text:'Could not draw a fight. Try again.'}));
    }
    next.disabled=false;
  }
  async function show(bout){
    state.lastTimeMachineFight=bout.id;
    try{sessionStorage.setItem('upset.timeMachine.last',bout.id);}catch{}
    // Older source data lists the winner first, so the side is set by the fight ID, never by the result.
    if([...String(bout.id)].reduce((sum,ch)=>(sum*31+ch.charCodeAt(0))>>>0,7)%2)bout={...bout,fighters:[bout.fighters[1],bout.fighters[0]]};
    const query='&before='+encodeURIComponent(bout.date)+'&window=0';
    const res=await api('/api/compare?a='+encodeURIComponent(bout.fighters[0].id)+'&b='+encodeURIComponent(bout.fighters[1].id)+query,signal).catch(()=>null);
    if(signal.aborted)return;
    const reports=res?res.fighters:bout.fighters.map(f=>({...f,summary:{career:{win:0,loss:0,other:0},streak:{}},metrics:{}}));
    const reveal=h('div',{class:'tm-reveal',hidden:true});
    const sides=reports.map((r,i)=>{
      const color=i?'blue':'red',score=r.rating?.score;
      const pick=h('button',{class:'btn tm-pick',type:'button',text:'Pick '+r.name,onclick:()=>choose(i)});
      const side=h('div',{class:'tm-side '+color},
        h('div',{class:'tm-id'},avatar(r,''),
          h('div',{style:'min-width:0'},h('h2',{class:'fit-name'},nameLines(r.name)),
            h('div',{class:'rec',text:res?careerRecord(r)+' in the UFC':''}),
            h('div',{class:'gc'},gradeChip(score),h('span',{text:score!=null?'UPSET rating that night':'Not enough fights to rate'})))),
        res?tmFacts(r):null,pick);
      return {side,pick,r};
    });
    async function choose(index){
      sides.forEach(s=>s.pick.disabled=true);
      next.disabled=true;
      let result=null;
      try{result=await api('/api/fight?id='+encodeURIComponent(bout.id),signal);}catch{}
      if(signal.aborted)return;
      const winnerIndex=result?.winner_id?reports.findIndex(r=>r.id===result.winner_id):-1;
      sides.forEach((s,i)=>{
        s.side.classList.add(winnerIndex<0?'is-loser':i===winnerIndex?'is-winner':'is-loser');
        s.pick.textContent=i===winnerIndex?(i===index?'Your pick · Winner':'Winner'):i===index?'Your pick':'—';

      const right=decided&&index===winnerIndex;

      const gap=decided&&winner.rating?.score!=null&&loser.rating?.score!=null?loser.rating.score-winner.rating.score:null;
      const odds=result?.pre_fight?.forecast;
      const chanceOf=r=>{if(!odds)return null;const k=result.fighters.findIndex(f=>f.id===r.id);return k<0?null:odds[k];};
      const chance=decided?chanceOf(winner):null;
      const oddsBar=odds&&typeof v5ForecastBar==='function'?h('div',{class:'tm-odds'},h('span',{text:'UPSET forecast going in'}),
        v5ForecastBar({probabilities:[chanceOf(reports[0]),chanceOf(reports[1])]},true)):null;
      const surprise=chance==null?null:h('p',{class:'tm-upset'},
        h('strong',{text:chance<.3?'Big upset. ':chance<.45?'Upset. ':chance<.5?'Slight upset. ':'The favorite won. '}),
        winner.name+' had '+(chance<.5?'only ':'')+'a '+Math.round(100*chance)+'% chance going in, using the fights before that night.');
      reveal.replaceChildren(...[
        h('div',{class:'tm-verdict '+(decided?(right?'right':'wrong'):''),text:!result?'Result unavailable':!decided?(result.outcome==='draw'?'It was a draw':'No contest'):right?'You got it':'Not this time'}),
        decided?h('p',{class:'tm-result'},h('b',{text:winner.name}),' beat '+loser.name+(how?' by '+how:'')+'.'):null,
        oddsBar,surprise,
        surprise?null:gap>0?h('p',{class:'tm-upset'},h('strong',{text:gap>=10?'Big upset. ':gap>=4?'Upset. ':'Slight upset. '}),
          winner.name+' went in rated '+gap+(gap===1?' point':' points')+' lower'+(gap<4?', close to even on these ratings.':'.')):
          gap!=null&&gap<0?h('p',{class:'tm-upset',text:'The higher-rated fighter won, as the ratings expected.'}):null,
        h('div',{class:'tm-links'},
          h('button',{class:'btn primary',type:'button',text:'Next fight →',onclick:()=>draw()}),
          h('a',{href:comparisonUrl(bout.fighters,bout.date,true),text:'Full pre-fight comparison'}),
          h('a',{href:fightUrl(bout.id),text:'Fight stats'}))].filter(Boolean));
      reveal.hidden=false;
      next.disabled=false;
      reveal.querySelector('button')?.focus({preventScroll:true});
    }
    stage.replaceChildren(h('article',{class:'tm-card'},
      h('div',{class:'tm-head'},h('div',null,bout.event_info?.title?h('div',{class:'tm-event',text:bout.event_info.title}):null,
          h('span',{class:'eyebrow',text:[bout.label,niceDate(bout.date),bout.event_info?.location].filter(Boolean).join(' · ')})),
        h('small',{text:'Who won? Numbers are from the day before the fight.'})),
      h('div',{class:'tm-sides','data-name-group':''},sides[0].side,h('div',{class:'tm-mid','aria-hidden':'true'},h('span',{class:'tm-vs'},h('span',{text:'VS'}))),sides[1].side),
      reveal));
  }
  $('content').replaceChildren(
    eventHeader('Time Machine','Go back to fight night. See the numbers both fighters brought into the cage, pick a winner, then reveal what happened.',
      {href:viewerUrl('/events'),text:'← All events'}),
    h('p',{class:'tm-note',text:'Each round is a random UFC title fight or recent main event. Your score stays in this browser until you close the tab.'}),
    scoreBox,stage,h('div',{class:'tm-controls'},next));
  if(fight)show(fight).finally(()=>{next.disabled=false;});
  else stage.replaceChildren(h('p',{class:'card muted',text:'No Time Machine matchups are available in this release.'}));
}

<script id="refresh-share-card-js">

async function cardEventContext(A,B){

    return {title:[next.name,bout.title?bout.division+' title':bout.division].filter(Boolean).join(' · '),

function cardFont(ctx,weight,size,family,spacing){

function cardOctagon(ctx,cx,cy,r){

  for(let k=0;k<8;k++){const a=Math.PI/8+k*Math.PI/4;ctx[k?'lineTo':'moveTo'](cx+r*Math.cos(a),cy+r*Math.sin(a));}

function cardGrade(ctx,cx,cy,score){
  const color=score==null?'#8a807d':score>=90?'#ef4b56':score>=80?'#f39947':score>=70?'#e7c955':'#65a6ef';
  cardOctagon(ctx,cx,cy,40);ctx.fillStyle=color;ctx.fill();
  cardOctagon(ctx,cx,cy,34);ctx.fillStyle='#141112';ctx.fill();
  ctx.fillStyle='#f4f5f7';ctx.textAlign='center';ctx.textBaseline='middle';
  cardFont(ctx,400,30,'"Russo One"');ctx.fillText(score??'—',cx,cy+2);
  cardFont(ctx,600,10,'Inter',1.2);ctx.fillStyle='#8a807d';ctx.fillText('UPSET',cx,cy+52);

}
function cardPortrait(ctx,img,x,y,w,hgt,r,side){
  ctx.fillStyle='#2a2323';ctx.fillRect(x,y,w,hgt);
  if(img){
    const scale=Math.max(w/img.width,hgt/img.height),sw=w/scale,sh=hgt/scale;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(img,(img.width-sw)/2,0,sw,sh,x,y,w,hgt);
    ctx.imageSmoothingEnabled=true;
  }else{
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.textAlign='center';ctx.textBaseline='middle';
    cardFont(ctx,800,92,'"Barlow Condensed"');ctx.fillText(initials(r.name),x+w/2,y+hgt/2);ctx.textBaseline='alphabetic';
  }
  ctx.fillStyle=side?'#3a86ff':'#e63946';ctx.fillRect(x,y+hgt-7,w,7);

function cardChips(ctx,history,x,y,alignRight){
  const items=history.slice(0,5).reverse(),size=26,gap=5,total=items.length*(size+gap)-gap;
  let left=alignRight?x-total:x;
  for(const f of items){
    ctx.fillStyle=f.outcome==='win'?'#2a9d6f':f.outcome==='loss'?'#c1121f':'#6b7280';
    ctx.fillRect(left,y-size+6,size,size);
    ctx.fillStyle='#fff';ctx.textAlign='center';cardFont(ctx,700,13,'Inter');
    ctx.fillText(resultChip(f),left+size/2,y-size/2+11);
    left+=size+gap;
  }
}
async function drawMatchupCard(A,B){
  await Promise.all(['400 40px "Russo One"','700 30px "Barlow Condensed"','600 16px Inter','500 16px Inter'].map(f=>document.fonts.load(f).catch(()=>{})));
  const [grunge,imgA,imgB,beltA,beltB,context]=await Promise.all([cardImage('/assets/grunge.jpg'),
    cardImage(A.roster?.image_url),cardImage(B.roster?.image_url),
    cardImage(A.championships?.titles?.[0]?.belt_url),cardImage(B.championships?.titles?.[0]?.belt_url),cardEventContext(A,B)]);
  const canvas=document.createElement('canvas');canvas.width=CARD_W;canvas.height=CARD_H;
  const ctx=canvas.getContext('2d'),M=CARD_M,W=CARD_W,mid=W/2;
  const text=(value,x,y,align,weight,size,family,color,spacing)=>{ctx.textAlign=align;cardFont(ctx,weight,size,family,spacing);ctx.fillStyle=color;ctx.fillText(value,x,y);};
  // Background with the site's red and blue corner glow.
  ctx.fillStyle='#0f0d0d';ctx.fillRect(0,0,W,CARD_H);
  for(const [x,color] of [[0,'rgba(230,57,70,.20)'],[W,'rgba(58,134,255,.18)']]){
    const g=ctx.createRadialGradient(x,0,0,x,0,760);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,CARD_H);

  ctx.fillStyle='#e63946';ctx.fillRect(0,0,mid,6);ctx.fillStyle='#3a86ff';ctx.fillRect(mid,0,mid,6);
  // Header
  text('UPSET',M,92,'left',400,58,'"Russo One"','#c1121f');
  text('MATCHUP REPORT',M+206,90,'left',600,14,'Inter','#8a807d',2.4);
  text(context?context.title.toUpperCase():'BEFORE '+niceDate(state.before).toUpperCase(),W-M,72,'right',700,26,'"Barlow Condensed"','#f4f5f7',1.4);
  text(context?context.detail.toUpperCase():(state.window==='0'?'CAREER UFC STATS':'LAST '+state.window+' UFC FIGHTS'),W-M,100,'right',600,18,'"Barlow Condensed"','#8a807d',1.6);
  // Face-off panel

  panel.addColorStop(0,'rgba(230,57,70,.30)');panel.addColorStop(.42,'#181414');panel.addColorStop(.58,'#181414');panel.addColorStop(1,'rgba(58,134,255,.28)');
  ctx.fillStyle=panel;ctx.fillRect(M,top,W-2*M,panelH);

    const cx=i?W*0.75-6:W*0.25+6,pw=190,ph=228,px=cx-pw/2,py=top+44;
    text(i?'BLUE CORNER':'RED CORNER',cx,top+30,'center',700,13,'Inter',i?'#83b6ff':'#ff737d',2.6);
    cardPortrait(ctx,img,px,py,pw,ph,r,i);
    cardGrade(ctx,i?px-4:px+pw+4,py+ph-28,r.rating?.score);
    let y=py+ph+(anyBelt?14:20);
    if(anyBelt){
      if(belt){const bw=180,bh=bw*belt.height/belt.width;ctx.drawImage(belt,cx-bw/2,y,bw,bh);}
      y+=56;
    }
    cardGrunge(ctx,r.name.toUpperCase(),cx,y+42,44,'center',grunge,W/2-M-40);
    text(careerRecord(r)+'  ·  '+streakText(r.summary.streak),cx,y+80,'center',700,26,'"Barlow Condensed"','#bdb5b3',.8);
    const title=r.championships?.titles?.[0];

  });
  cardGrunge(ctx,'VS',mid,top+210,64,'center',grunge);
  // Tale of the tape
  const pa=A.profile,pb=B.profile;
  const height=v=>feet(v)||'—',reach=v=>v!=null?v+'″':'—';
  const proA=A.professional_record,proB=B.professional_record;
  const tape=[
    ['UFC record',careerRecord(A),careerRecord(B),0],
    proA||proB?['Pro MMA record',proA?proRecordText(proA):'—',proB?proRecordText(proB):'—',0]:null,
    ['Age',A.summary.age??'—',B.summary.age??'—',0],
    ['Height',height(pa.height_inches),height(pb.height_inches),higher(pa.height_inches,pb.height_inches)],
    ['Reach',reach(pa.reach_inches),reach(pb.reach_inches),higher(pa.reach_inches,pb.reach_inches)],
    ['Stance',pa.stance||'—',pb.stance||'—',0],
    ['Last 5','chips','chips',0],
  ].filter(Boolean);
  let y=top+panelH+48;

  section('TALE OF THE TAPE',y);
  y+=16;

  for(const [label,a,b,edge] of tape){
    y+=rowH;

    else{

  const stats=[
    ['Sig. strikes landed / min','sig_landed_per_minute',fmt,false],
    ['Sig. strikes absorbed / min','sig_absorbed_per_minute',fmt,true],
    ['Striking accuracy','striking_accuracy',pct,false],
    ['Striking defense','striking_defense',pct,false],
    ['Takedowns / 15 min','takedowns_per_15_minutes',fmt,false],
    ['Takedown defense','takedown_defense',pct,false],
  ];
  y+=8;
  const barMax=210;
  for(const [label,key,format,lower] of stats){
    y+=41;

    W-M,fy-1,'right',500,14,'Inter','#8a807d');
  return canvas;
}
function matchupShare(A,B){
  const pair=[A,B].map(fighter=>encodeURIComponent(fighter.id)).join('/');
  const query=new URLSearchParams({before:state.before,window:state.window});
  const url=new URL('/compare/'+pair+'?'+query,location.origin).href;
  const input=h('input',{class:'share-url',value:url,readonly:true,'aria-label':'Matchup link',hidden:true});
  const status=h('span',{role:'status',class:'muted'});
  const copy=h('button',{class:'btn',type:'button',text:'Copy matchup link',onclick:async()=>{
    try{await navigator.clipboard.writeText(url);status.textContent='Link copied';}
    catch{input.hidden=false;input.focus();input.select();status.textContent='Copy the selected link';}
  }});
  const download=h('button',{class:'btn',type:'button',text:'Download matchup card',onclick:async()=>{
    download.disabled=true;status.textContent='Drawing your card…';
    try{
      const canvas=await drawMatchupCard(A,B);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
      const link=h('a',{href:URL.createObjectURL(blob),download:[A.name,'vs',B.name,'UPSET'].join(' ').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png'});
      document.body.append(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(link.href),4000);
      status.textContent='Card downloaded';
    }catch{
      status.textContent='Could not draw the card here. ';
      status.append(h('a',{href:'/share/'+pair+'.png?'+query,download:'upset-matchup.png',text:'Download the basic card'}));
    }
    download.disabled=false;
  }});
  return h('div',{class:'matchup-share'},copy,download,input,status);
}

    });

      hpCorner(leadPair.fighters[0],'red'),
      h('div',{class:'hp-vs'},h('div',{class:'bigvs'},h('span',{class:'distressed',text:'VS'})),

      hpCorner(leadPair.fighters[1],'blue')):h('div',{class:'hp-card'},scheduledRow(main,null)));
    for(const section of sectionNodes)
      section.list.replaceChildren(section.list.firstChild,...section.rows.map(bout=>scheduledRow(bout,byBout.get(bout))));

  renderEvent=function(event){

<script id="refresh-corrections-js">
function dcSavedReports(){try{return JSON.parse(localStorage.getItem('upset.reports'))||[];}catch{return [];}}
function dcReportDialog(){
  const where=location.href;
  const kind=h('select',null,['Wrong result or method','Missing fight','Wrong record','Wrong name, photo or profile detail','Rating looks wrong','Something else'].map(t=>h('option',{text:t})));
  const details=h('textarea',{placeholder:'What is wrong, and what should it say?'});
  const source=h('input',{type:'url',placeholder:'https://… (official result, UFC.com, commission)'});
  const done=h('div',{class:'dc-done','aria-live':'polite'});
  const text=()=>['UPSET data report',
    'What: '+kind.value,'Page: '+where,'Details: '+(details.value.trim()||'—'),'Source: '+(source.value.trim()||'—'),'Reported: '+new Date().toISOString()].join('\n');
  const dialog=h('dialog',{class:'dc-dialog','aria-label':'Report a data error'});
  const close=()=>{if(dialog.open)dialog.close();dialog.remove();};
  dialog.addEventListener('close',()=>dialog.remove());
  dialog.append(h('h2',{text:'Report a data error'}),
    h('p',{text:'Every report is checked against an official source before anything changes. Fixed errors are listed on the Data checks page.'}),
    h('div',{class:'where',text:'Page: '+where}),
    h('label',null,'What’s wrong',kind),h('label',null,'Details',details),h('label',null,'Source (optional)',source),
    h('div',{class:'row'},
      h('button',{class:'btn',type:'button',text:'Cancel',onclick:close}),
      h('button',{class:'btn',type:'button',text:'Copy report',onclick:async()=>{
        try{await navigator.clipboard.writeText(text());done.textContent='Copied. Paste it wherever you track fixes.';}catch{done.textContent='Copy failed: select the text and copy it manually.';}}}),
      h('button',{class:'btn primary',type:'button',text:'Save report',onclick:()=>{
        if(!details.value.trim()){done.textContent='Add a short description first.';details.focus();return;}
        const list=dcSavedReports();list.unshift({kind:kind.value,page:where,details:details.value.trim(),source:source.value.trim(),at:new Date().toISOString()});
        try{localStorage.setItem('upset.reports',JSON.stringify(list.slice(0,200)));done.textContent='Saved. It is listed on the Data checks page.';}

<script id="refresh-compare-record-js">
(()=>{
  /* ---------------- shared ---------------- */
  let recordCache=null;
  function loadRecord(){
    if(!recordCache)recordCache=fetch('/api/record').then(r=>r.ok?r.json():null).catch(()=>null);
    return recordCache;
  }
  const lockTime=iso=>new Date(iso).toLocaleString([],{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  const shortPrint=hex=>hex.slice(0,8)+'…'+hex.slice(-4);
  const pct=p=>Math.round(100*p)+'%';
  async function timedApi(url,signal,ms=8000){
    const ctl=new AbortController(),stop=()=>ctl.abort();
    signal?.addEventListener('abort',stop);
    const limit=setTimeout(stop,ms);
    try{return await api(url,ctl.signal);}finally{clearTimeout(limit);signal?.removeEventListener('abort',stop);}
  }

  /* ---------------- compare picker ---------------- */
  function pickerSlot(index,chosen,onChoose,onClear){
    const color=index?'blue':'red';
    const label=h('span',{class:'corner-label',text:index?'Blue corner':'Red corner'});
    if(chosen){
      const face=avatar(chosen,'mini');
      if(!chosen.roster?.image_url)fetch('/api/fighters?q='+encodeURIComponent(chosen.name)).then(r=>r.ok?r.json():[]).then(rows=>{
        const match=rows.find(r=>r.id===chosen.id);
        if(!match?.roster?.image_url||!face.isConnected)return;
        chosen.roster=match.roster;
        const slot=state.matchup.findIndex(f=>f?.id===chosen.id);
        if(slot>=0){state.matchup[slot]={...state.matchup[slot],roster:{image_url:match.roster.image_url,image_credit:match.roster.image_credit}};saveMatchup();}
        face.replaceWith(avatar(match,'mini'));
      }).catch(()=>{});
      return {el:h('div',{class:'cp-slot '+color},label,h('div',{class:'cp-chosen'},face,
        h('div',{style:'min-width:0'},h('b',{text:chosen.name}),chosen.meta?h('small',{text:chosen.meta}):null),
        h('button',{class:'btn',type:'button',text:'Change','aria-label':'Change '+chosen.name,onclick:onClear}))),focus:()=>{}};
    }
    const input=h('input',{class:'cp-input',type:'search',autocomplete:'off',spellcheck:'false','aria-label':(index?'Blue':'Red')+' corner fighter',
      placeholder:index?'Search the second fighter':'Search the first fighter'});
    const list=h('div',{class:'cp-results',role:'listbox'});
    let timer=0,ctl=null,version=0;
    const status=(text,retry)=>list.replaceChildren(h('div',{class:'cp-status',role:'status'},h('span',{text}),
      retry?h('button',{class:'btn',type:'button',text:'Try again',onclick:()=>{input.focus();run();}}):null));
    async function run(){
      const q=input.value.trim(),mine=++version;
      ctl?.abort();
      if(!q){list.replaceChildren();return;}
      ctl=new AbortController();
      const slow=setTimeout(()=>{if(mine===version)status('Searching…');},450);
      try{
        const rows=await timedApi('/api/fighters?q='+encodeURIComponent(q)+'&before='+encodeURIComponent(state.before||''),ctl.signal);
        if(mine!==version)return;
        list.replaceChildren(...(rows.length?rows.slice(0,8).map(r=>{
          const meta=[r.division,r.recorded_bouts?r.recorded_bouts+' UFC '+(r.recorded_bouts===1?'fight':'fights'):null,r.last_bout?'last '+r.last_bout.slice(0,4):null].filter(Boolean).join(' · ');
          return h('button',{class:'cp-opt',type:'button',role:'option',onclick:()=>onChoose({...r,meta})},avatar(r,'mini'),h('div',null,h('b',{text:r.name}),h('small',{text:meta})));
        }):[h('div',{class:'cp-status'},h('span',{text:'No fighter matches “'+q+'”.'}))]));
      }catch{
        if(mine===version)status(navigator.onLine===false?'You’re offline. Reconnect, then try again.':'Couldn’t reach UPSET. Check the connection, then try again.',true);
      }finally{clearTimeout(slow);}
    }
    input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,160);});
    input.addEventListener('keydown',e=>{
      const opts=[...list.querySelectorAll('.cp-opt')];
      if(e.key==='Enter'&&opts.length){e.preventDefault();opts[0].click();}
      else if(e.key==='ArrowDown'&&opts.length){e.preventDefault();opts[0].focus();}
    });
    list.addEventListener('keydown',e=>{
      const opts=[...list.querySelectorAll('.cp-opt')],i=opts.indexOf(document.activeElement);
      if(e.key==='ArrowDown'&&i>=0){e.preventDefault();(opts[i+1]||opts[i]).focus();}
      if(e.key==='ArrowUp'&&i>=0){e.preventDefault();(i?opts[i-1]:input).focus();}
    });
    return {el:h('div',{class:'cp-slot '+color},label,input,list),focus:()=>input.focus({preventScroll:false})};
  }

  async function renderComparePicker({signal}){
    $('filters').hidden=true;
    document.title='Compare fighters · UPSET';
    const chosen=state.matchup.map(f=>f?{...f}:null);
    const content=$('content');
    const wrap=h('div',{class:'cp-wrap'});
    const week=h('section',{class:'cp-section'});
    function finish(){
      const [a,b]=chosen;
      state.matchup=[{id:a.id,name:a.name,roster:a.roster},{id:b.id,name:b.name,roster:b.roster}];
      saveMatchup();renderTray();
      go('#/compare/'+encodeURIComponent(a.id)+'/'+encodeURIComponent(b.id));
    }
    function draw(focusIndex){
      const slots=[0,1].map(i=>pickerSlot(i,chosen[i],r=>{
        if(chosen[1-i]?.id===r.id)return;
        chosen[i]=r;
        state.matchup[i]={id:r.id,name:r.name,roster:r.roster};saveMatchup();renderTray();
        if(chosen[0]&&chosen[1])finish();else draw(chosen[0]?1:0);
      },()=>{chosen[i]=null;state.matchup[i]=null;saveMatchup();renderTray();draw(i);}));
      const swap=h('button',{class:'btn',type:'button',text:'⇄ Swap','aria-label':'Swap corners',disabled:!(chosen[0]||chosen[1]),
        onclick:()=>{chosen.reverse();state.matchup=chosen.map(f=>f?{id:f.id,name:f.name,roster:f.roster}:null);saveMatchup();renderTray();draw();}});
      wrap.replaceChildren(slots[0].el,h('div',{class:'cp-mid'},h('span',{class:'vs distressed',text:'VS'}),swap),slots[1].el);
      drawGo();
      if(focusIndex!=null)requestAnimationFrame(()=>slots[focusIndex].focus());
    }
    const goRow=h('div',{class:'cp-go'});
    function drawGo(){
      goRow.replaceChildren(...[chosen[0]&&chosen[1]?h('button',{class:'btn primary',type:'button',text:'View matchup →',onclick:finish}):null,
        h('small',{class:'muted',text:'Tip: the matchup page can compare fighters as of any past date, to see how a fight looked going in.'})].filter(Boolean));
    }
    content.replaceChildren(
      eventHeader('Compare fighters','Pick any two UFC fighters to see their records, UPSET ratings, the forecast and fight stats side by side.'),
      wrap,goRow,week);
    draw(chosen[0]&&!chosen[1]?1:(!chosen[0]?0:null));
    // One-tap matchups from the next card.
    try{
      const events=await timedApi('/api/events',signal);
      const next=events.scheduled;
      if(!next||signal.aborted)return;
      const card=await timedApi('/api/event?slug='+encodeURIComponent(next.slug),signal);
      if(signal.aborted)return;
      const bouts=card.bouts.filter(b=>b.fighters.every(f=>f.id));
      if(!bouts.length)return;
      week.replaceChildren(h('h2',{text:'This week · '+eventTitle(card)}),
        h('p',{text:'One tap to compare any fight on the next card.'}),
        h('div',{class:'cp-chips'},bouts.map(b=>{
          const p=b.forecast?.status==='available'?b.forecast.probabilities:null;
          return h('a',{class:'cp-chip',href:viewerUrl('/compare/'+encodeURIComponent(b.fighters[0].id)+'/'+encodeURIComponent(b.fighters[1].id))},
            h('span',{text:b.fighters.map(f=>f.name).join(' vs ')}),
            h('small',{text:p?'UPSET '+pct(Math.max(...p))+' '+b.fighters[p[0]>=p[1]?0:1].name.split(' ').slice(-1)[0]:(b.division||'')}));
        })));
    }catch{}
  }
  EXTRA_ROUTES.compare=async ctx=>{
    if(ctx.parts.length>2)return false;
    await renderComparePicker(ctx);
  };
  // "Find an opponent" opens the picker with this fighter already in the red corner.
  const opponent=document.getElementById('choose-opponent');
  if(opponent)opponent.onclick=()=>go('#/compare');

  /* ---------------- track record ---------------- */
  function resultChip(result){
    if(result.status==='graded')return h('span',{class:'tr-res '+(result.correct?'right':'wrong'),text:result.correct?'✓ Right':'✗ Wrong'});
    if(result.status==='void'||result.status==='not_held')return h('span',{class:'tr-res',text:result.status==='void'?'No result':'Not held'});
    return h('span',{class:'tr-res',text:'Pending'});
  }
  function pickRow(pick){
    const ids=pick.fighters.map(f=>f.id),side=ids.indexOf(pick.pick),other=pick.fighters[1-side];
    const mine=pick.probabilities[side],market=pick.market?pick.market.probabilities[side]:null;
    const split=market!=null&&market<.5;
    return h('a',{class:'tr-row',href:viewerUrl('/compare/'+encodeURIComponent(ids[0])+'/'+encodeURIComponent(ids[1]))},
      h('div',{class:'tr-who'},h('b',{text:pick.pick_name}),' over '+other.name,
        h('small',{text:[pick.title?'Title fight':null,pick.division,pick.provisional?'provisional rating':null,pick.inactive?'inactive 2+ years':null].filter(Boolean).join(' · ')})),
      h('div',{class:'tr-num'},pct(mine),h('small',{text:'UPSET'})),
      h('div',{class:'tr-num'+(split?' split':'')},market!=null?pct(market):'—',h('small',{text:split?'market disagrees':'market'})),
      resultChip(pick.result));
  }
  function eventCard(item){
    if(item.error)return h('section',{class:'tr-event'},h('div',{class:'tr-head'},h('div',null,h('h2',{text:item.slug}),
      h('div',{class:'meta',text:'This file failed its fingerprint check and is not counted: '+item.error}))));
    const e=item.event,s=item.summary;
    const scored=s.graded?s.correct+'–'+(s.graded-s.correct)+' ('+pct(s.correct/s.graded)+')':null;
    return h('section',{class:'tr-event'},
      h('div',{class:'tr-head'},
        h('div',null,h('span',{class:'tr-lock',text:'🔒 Locked '+lockTime(item.frozen_at)}),
          h('h2',{text:eventTitle(e)}),
          h('div',{class:'meta',text:[niceDate(e.date),e.venue,item.picks.length+' picks'+(item.not_picked.length?' · '+item.not_picked.length+' bout not forecast':'')].filter(Boolean).join(' · ')})),
        h('div',{style:'display:grid;gap:6px;justify-items:start'},
          h('div',{class:'tr-fp',title:'SHA-256 of picks.json: '+item.sha256,text:'Fingerprint '+shortPrint(item.sha256)}),
          h('div',{class:'tr-links'},
            h('a',{href:'/published/picks.json?slug='+encodeURIComponent(item.slug),download:item.slug+'-picks.json',text:'Download picks.json'}),
            h('a',{href:eventUrl(e.slug),text:'Event page →'})))),
      h('div',{class:'tr-rows'},
        h('div',{class:'tr-row head'},h('span',{text:'UPSET pick'}),h('span',{text:'Chance'}),h('span',{text:'Market'}),h('span',{text:'Result'})),
        ...item.picks.map(pickRow)),
      h('div',{class:'tr-foot',text:scored?'UPSET went '+scored+' on this card'+(s.market_bouts?'; the market went '+s.market_correct+'–'+(s.market_bouts-s.market_correct)+' on the '+s.market_bouts+' fights it priced':'')+
        '. Log loss '+s.log_loss+(s.market_log_loss!=null?' vs market '+s.market_log_loss:'')+' (lower is better).'
        :'Picks are graded once official results are in. Market prices come from '+(item.market_source?.name||'—')+' as captured before the lock.'}));
  }
  async function renderRecord({signal}){
    $('filters').hidden=true;
    document.title='Track record · UPSET';
    const record=await (async()=>{try{return await timedApi('/api/record',signal);}catch{return null;}})();
    if(signal.aborted)return;
    const header=eventHeader('Track record','UPSET’s picks, locked before each card and graded after it.');
    if(!record){$('content').replaceChildren(header,h('p',{class:'card muted',text:'The track record is not available from this server yet. Restart UPSET to load it.'}));return;}
    const s=record.summary,events=record.events.filter(e=>!e.error),first=events[events.length-1],latest=events[0];
    const replay=latest?.model?.record_before_publishing?.since_2019;
    const tile=(value,label)=>h('div',{class:'tr-tile'},h('strong',{text:value}),h('span',{text:label}));
    $('content').replaceChildren(header,
      h('div',{class:'tr-tiles'},
        s.graded?tile(s.correct+'–'+(s.graded-s.correct),'live record · '+pct(s.correct/s.graded)+' right'):tile(int(s.picks),'picks locked so far'),
        s.graded?tile(String(s.log_loss),'log loss · lower is better'+(s.market_log_loss!=null?' · market '+s.market_log_loss:'')):tile(String(s.pending),'waiting for results'),
        tile(String(events.length),events.length===1?'card published':'cards published'),
        replay?tile(pct(replay.accuracy),'favorite won in the replay since 2019 ('+int(replay.bouts)+' fights). A replay, not live picks.'):tile(first?niceDate(first.event.date):'—','first published card')),
      h('details',{class:'ut-about tr-about'},h('summary',{text:'How picks are locked and graded'}),
        h('p',{text:'Picks are frozen before the first fight, and the exact time is shown. Each card’s file gets a SHA-256 fingerprint: '+
          'download it and check, because changing a single digit changes the fingerprint.'}),
        h('p',{text:(latest?.rules||'')+' Every miss stays on the page.'}),
        h('p',{text:'The market column is the betting market’s chance at the time of the lock, from a public-domain daily odds archive with the bookmaker margin removed. '+
          'It’s there to show where UPSET disagrees. Nothing here is betting advice.'})),
      ...record.events.map(eventCard));
  }
  EXTRA_ROUTES.record=async ctx=>{
    if(ctx.parts.length>1)return false;
    await renderRecord(ctx);
  };

  /* ---------------- event page banner ---------------- */
  const previousEvent=renderEvent;
  renderEvent=function(event){
    previousEvent(event);
    loadRecord().then(record=>{
      const item=record?.events.find(e=>!e.error&&(e.slug===event.slug||(e.event.date===event.date&&e.event.name===event.name)));
      if(!item||state.view!=='event'||document.querySelector('.pk-banner'))return;
      const s=item.summary;
      const text=s.graded?['UPSET went ',h('b',{text:s.correct+'–'+(s.graded-s.correct)}),' on this card with picks locked '+lockTime(item.frozen_at)+'.']
        :[h('b',{text:'🔒 UPSET picks locked'}),' '+lockTime(item.frozen_at)+' · fingerprint '+shortPrint(item.sha256)];
      const banner=h('div',{class:'pk-banner'},h('span',null,...text),h('a',{href:viewerUrl('/record'),text:'See the track record →'}));
      const head=$('content').querySelector('.event-header');
      if(head)head.after(banner);else $('content').prepend(banner);
    });
  };

  /* ---------------- homepage entry points ---------------- */
  const previousHome=renderHome;
  renderHome=function(signal){
    const done=previousHome(signal);
    const slot=$('content').querySelector('.hero-search');
    if(slot&&!slot.querySelector('.hp-compare-link')){
      slot.append(h('a',{class:'hp-compare-link',href:viewerUrl('/compare'),text:'⇄ Or compare two fighters →'}));
      loadRecord().then(record=>{
        const item=record?.events.find(e=>!e.error&&e.summary.pending);
        if(item&&slot.isConnected)slot.append(h('a',{class:'hp-record-link',href:viewerUrl('/record'),
          text:'🔒 '+item.picks.length+' '+eventTitle(item.event).split(' · ')[0]+' picks locked before fight night · Track record →'}));
      });
    }
    return done;
  };
})();
</script>

<script id="refresh-skill-profile-js">
(()=>{
  const cache=new Map();
  const load=id=>{if(!cache.has(id))cache.set(id,fetch('/api/skills?id='+encodeURIComponent(id)).then(r=>r.ok?r.json():null).catch(()=>null));return cache.get(id);};
  const top=p=>p>=60?'Top '+Math.max(1,100-p)+'%':p<=40?'Bottom '+Math.max(1,p)+'%':'Average';
  const track=(s,cls)=>h('div',{class:'sk-track '+(cls||''),title:s.about+'. Likely range: '+s.low+'th to '+s.high+'th percentile.'},
    h('i',{class:'sk-band',style:'left:'+s.low+'%;width:'+Math.max(2,s.high-s.low)+'%'}),h('i',{class:'sk-dot',style:'left:'+s.percentile+'%'}));
  function profileCard(name,d){
    return h('section',{class:'sk-card','aria-label':'Skill profile'},
      h('div',{class:'sk-head'},h('h2',{text:'Skill profile'}),h('small',{text:'vs '+d.compared_with+' active UFC fighters · '+d.fights+' fights measured'})),
      ...d.skills.map(s=>h('div',{class:'sk-row'},h('span',{text:s.label}),track(s),h('b',{text:top(s.percentile)}))),
      d.similar.length?h('p',{class:'sk-like'},'Fights most like: ',...d.similar.flatMap((f,i)=>[i?', ':'',h('a',{href:viewerUrl('/fighter/'+encodeURIComponent(f.id)),text:f.name})])):null,
      h('p',{class:'sk-fine',text:'The mark is the estimate and the shaded band is how sure it is: wide bands mean few fights. '+d.label}));
  }
  function clashCard(A,B,a,b){
    const last=n=>n.split(' ').slice(-1)[0];
    return h('section',{class:'sk-card sk-clash','aria-label':'Skill clash'},
      h('div',{class:'sk-head'},h('h2',{text:'Skill clash'}),h('small',{text:'Percentile among active UFC fighters · band shows uncertainty'})),
      h('div',{class:'sk-names'},h('span',{text:last(A.name)}),h('span',{text:last(B.name)})),
      ...a.skills.map((s,i)=>{const t=b.skills[i],clear=s.low>t.high?0:t.low>s.high?1:-1;
        return h('div',{class:'sk-row'},h('b',{class:'l'+(clear===0?' sk-edge':''),text:s.percentile}),track(s,'mirror'),h('span',{text:s.label}),
          h('div',{class:'sk-row blue',style:'display:contents'},track(t)),h('b',{class:clear===1?'sk-edge':'',text:t.percentile}));}),
      h('p',{class:'sk-fine',text:'Green marks a clear edge: the two likely ranges don’t overlap. In testing, skill-against-skill matchups did not predict winners better than the UPSET forecast, so read this as how the fight may look, not who wins.'}));
  }
  const place=node=>{const c=$('content'),old=c.querySelector('.sk-card');if(old)old.remove();
    const anchor=c.querySelector('.v5-forecast')||c.firstElementChild;anchor?anchor.after(node):c.append(node);};
  const previousFighter=renderFighter;
  renderFighter=function(r){
    previousFighter(r);
    load(r.id).then(d=>{if(d&&d.status==='available'&&state.view==='fighter'&&readRoute().parts[1]===r.id)place(profileCard(r.name,d));});
  };
  const previousCompare=renderCompare;
  renderCompare=function(res){
    previousCompare(res);
    const [A,B]=res.fighters;
    Promise.all([load(A.id),load(B.id)]).then(([a,b])=>{
      if(a&&b&&a.status==='available'&&b.status==='available'&&state.view==='compare')place(clashCard(A,B,a,b));});
  };
})();
</script>
<!-- UPSET REFRESH END: skill-profile -->
